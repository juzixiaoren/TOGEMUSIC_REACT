services:
  frontend:
    build:
      context: ./frontend
    image: juzixiaoren/togemusic-react:frontend-v11 # 您的前端镜像名
    ports:
      - "14514:14514"
    depends_on:
      - backend

  backend:
    build: ./backend
    image: juzixiaoren/togemusic-react:backend-v11 # 您的后端镜像名
    ports:
      - "8034:8034"
    depends_on:
      - redis
    volumes:
      - ./data/db:/backend/dao/db
      - ./data/uploads:/backend/server/uploads
    environment:
      - CORS_ORIGINS=*
      - SOCKET_PATH=/socket.io
      - PYTHONUNBUFFERED=1
      - SOCKETIO_ASYNC_MODE=gevent
      - SOCKETIO_MESSAGE_QUEUE=redis://redis:6379/0
      - GUNICORN_WORKERS=1
      - QQMUSIC_COOKIE=${QQMUSIC_COOKIE:-}
      # ========== 存储后端配置 ==========
      - STORAGE_BACKEND=${STORAGE_BACKEND:-cos}
      # ========== 腾讯云 COS 配置 ==========
      - COS_SECRET_ID=${COS_SECRET_ID:-}
      - COS_SECRET_KEY=${COS_SECRET_KEY:-}
      - COS_BUCKET=${COS_BUCKET:-}
      - COS_REGION=${COS_REGION:-ap-guangzhou}
      - COS_PRESIGN_EXPIRE=${COS_PRESIGN_EXPIRE:-3600}

  redis:
    image: redis:7-alpine
    restart: unless-stopped
